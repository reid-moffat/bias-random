name: CI
on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link package
        run: pnpm link --global

      - name: Lint
        run: pnpm run lint

  build-link:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x", "24.x"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
      fail-fast: false
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Link package
        run: pnpm link --global

  test:
    needs: build-link
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x", "24.x"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
      fail-fast: false
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Link package
        run: pnpm link --global

      - name: Test
        run: pnpm run test
