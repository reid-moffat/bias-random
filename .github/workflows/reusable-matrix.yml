name: Reusable Matrix Workflow
on:
  workflow_call:
    inputs:
      use-matrix:
        required: true
        type: boolean
      run-command:
        required: false
        type: string
      run-command-description:
        required: false
        type: string

jobs:
  matrix-job:
    runs-on: ${{ inputs.use-matrix && matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: ${{ inputs.use-matrix && fromJson('["18.x", "20.x", "22.x", "24.x"]') || fromJson('["24.x"]') }}
        os: ${{ inputs.use-matrix && fromJson('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJson('["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Link package
        run: pnpm link --global

      - name: ${{ inputs.run-command-description }}
        run: ${{ inputs.run-command }}
