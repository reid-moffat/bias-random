name: Reusable Matrix Workflow
on:
  workflow_call:
    inputs:
      run-command:
        required: true
        type: string
      use-matrix:
        required: false
        type: boolean
        default: true

jobs:
  matrix-job:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        shell: bash

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build package
        run: pnpm run build
        shell: bash

      - name: Link package
        run: pnpm link --global
        shell: bash

      - run: ${{ inputs.run-command }}
        shell: bash
