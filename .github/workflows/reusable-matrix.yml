name: Reusable Matrix Workflow
on:
  workflow_call:
    inputs:
      run-command:
        required: true
        type: string
      use-matrix:
        required: false
        type: boolean
        default: true

jobs:
  matrix-job:
    runs-on: ${{ inputs.use-matrix && matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: ${{ inputs.use-matrix && fromJson('[\"18.x\", \"20.x\", \"22.x\", \"24.x\"]') || fromJson('[\"24.x\"]') }}
        os: ${{ inputs.use-matrix && fromJson('[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]') || fromJson('[\"ubuntu-latest\"]') }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Link package
        run: pnpm link --global

      - run: ${{ inputs.run-command }}
